name = spellGrammarCheck

summary = "Spelling and Grammar Check"
description = """Reads the F7 spelling and grammar checker in Microsoft Word and Microsoft Outlook clearly, and nothing else. It does not mute browse mode, and it does not change anything about how NVDA behaves outside the proofing checker.

For every issue the checker finds, it announces "misspelled" or "Grammar error", then the word or phrase involved, spoken and then spelled out. If you ask it to, it moves straight into the suggestions list and reads the first suggestion, spoken and spelled, with its position in the list. If an issue has no suggestions at all, it says so plainly: "No suggestions."

It supports both the classic Word/Outlook spelling and grammar dialog and the newer Microsoft Editor task pane, and it announces "Spell check is complete" once, at the end of a check, whether or not anything was found.

Two settings live in the NVDA menu, under Preferences, Settings, Spelling and Grammar Check: whether the suggestions list is entered automatically, and whether misspelled words and suggestions are read a little more slowly than usual."""
author = "Josh Kennedy <joshknnd1982@gmail.com>"
version = 1.0.70
changelog = """1.0.70
Removes the debug-only diagnostics added while tracking down 1.0.69's fix (a full call-stack dump on every _findSuggestionList entry, a window-handle/futile-window-set dump in _quickRecheckSuggestionFocus, and per-attempt tracing in _focusSuggestionList/_verifySuggestionFocus). A user-supplied 1.0.69 log confirmed the fix itself works -- no more session-wide ~1s freezes -- so this logging is no longer needed. No behavior changes.

1.0.55
Fixed the ~1 second pause that could still land right before a suggestion (or "No suggestions") in a supplied 1.0.54 log -- reproduced on both "gave" and "quite"/"quiet". After sending the suggestions-list shortcut, the add-on checks once, cheaply, whether Word has already moved focus into the list; if not, it immediately pays for a much slower full scan of the dialog. The log showed Word sometimes settling focus a little later on its own, which the single early check couldn't see. It now tries that same cheap check once more, a little later, before falling back to the slow scan -- costing nothing when the slow scan is genuinely needed, but skipping it entirely in cases where Word was just about to finish moving focus anyway.

1.0.54
Fixed the actual cause of the pause before "No spelling/grammar suggestions available" (and, it turns out, before some real suggestions too, like "who is" for "who's"). 1.0.53 fixed a different, real problem in a separate code path, but a fresh log showed the pause was still there -- because the word-announcement path also tries to auto-focus the suggestions list, and that's what was running the slow scan. The scan already had a fast fallback -- a plain Windows window-class check -- but only tried it after the slow scan, not before. Swapped the order, so the fast check runs first and the slow one is now only a last resort.

1.0.53
Fixed the real cause of the ~1-1.5 second pause right before "No spelling/grammar suggestions available", found using a fresh log after 1.0.52 (which targeted the wrong cause -- the pause was unchanged, and one more case of it showed up). The pause was not from re-scanning for suggestions; it was from returning focus to the error field, which this message does first so Outlook's Alt+C/Alt+X commands keep working afterward. On this build that focus change reliably takes over a second (the same slow Word property read logged elsewhere as "Unable to get activePane"). The message is now spoken first, and the refocus happens right after instead of before -- the same order every other announcement in this add-on already used.

1.0.52
Fixed a ~1-second pause found right before "No spelling suggestions available" and "No grammar suggestions available" in a supplied 1.0.51 log. Looking for a suggestions list retries a few times, up to roughly 900ms total, while waiting for Word to populate it; the previous 0.6-second window for skipping a repeat scan on a genuinely empty list expired before the last retry, so a second full, slow dialog scan ran right at the end anyway. That window is now long enough to cover the whole retry sequence, so only one scan happens per issue.

1.0.51
Fixed another recurring half-second-to-one-second pause, seen right before nearly every single issue in a supplied 1.0.50 log, just before "checker is asking about X" in the debug log. On this Word/Outlook build, the cheap ways of reading the misspelled/flagged word (the dialog's own name, value, bold text, etc.) always come back empty, so every single issue fell through to the one source that has to read the live document's selection — which is what triggers NVDA's slow generic child-walk. The add-on now remembers which source actually worked last time for a given dialog and tries that one first, instead of re-failing the same empty sources on every issue.

1.0.50

Two more slowdowns fixed using the 1.0.49 log:

Classic-dialog classification (misspelled vs. Grammar error) now stops reading the dialog as soon as a decisive word or phrase is found, instead of always reading every control in it. The log showed this taking roughly 1-2 seconds per issue via NVDA's slow generic child-walk; the classification result is unchanged, only how much of the dialog gets read before it is reached.

Looking for a suggestions list when none exists (e.g. "No grammar suggestions available") retries the same slow, exhaustive dialog scan up to four times a few hundred milliseconds apart while waiting for Word to populate the list. The log showed this adding up to several seconds of silence, including one six-second stall, when the dialog genuinely had no suggestions at all. Repeat scans within a short window of an empty result are now skipped rather than redone from scratch.

1.0.49

Creates the clean performance build. It retains the proven 1.0.46 optimization—defer the 375–458 ms document-body format read until dialog evidence is inconclusive—and removes the temporary timing instrumentation. The 1.0.48 log showed the remaining dialog tree contains stale earlier-error labels, so reducing that scan further would risk a wrong grammar/spelling classification.

1.0.48
The 1.0.47 timing log confirms the deferred document-body lookup reduced classic classification from roughly 600–800 ms to 107–318 ms. This debug-only build records the exact dialog object and property containing the existing decisive grammar or spelling marker, so the remaining 100–154 ms dialog-tree scan can be shortened without changing classification behavior.

1.0.47
Adds timing detail for the remaining classic-dialog reads: the label reads on the focus object and its ancestors, plus the number of accessible objects and properties examined in the dialog-tree scan. It changes no proofing behavior and identifies the next measured speed target after 1.0.46’s deferred document-body lookup.

1.0.46
Speeds up proofing classification using evidence from the supplied timing log. Word’s dialog explanation already classified the tested grammar and spelling items, but the add-on was first reading the document body’s format annotation—a 375–458 ms operation that coincided with watchdog pauses. It now uses that body read only when the dialog evidence is inconclusive, preserving it as a classification fallback.

1.0.45
Fixes “eight” Alt+C/Alt+X using the focus event Word actually delivers. The 1.0.44 log showed the real Ignore Once focus event at 18:00:48.206 but no delayed Space input afterwards. Once Word confirms that focus, the add-on now immediately sends Word’s proven Alt+I Ignore Once command; it no longer relies on a polling callback.

1.0.44
Adds debug-only timing for Office error-text reads, format reads, document-body lookup, dialog-text lookup, and the total classic-proofing classification. Only operations taking 100 ms or longer are recorded; behavior and speech are unchanged. This identifies whether the watchdog pauses recorded during spell checking are caused by this add-on’s Office reads or occur elsewhere in NVDA/Office.

1.0.43
Fixes the remaining “eight” activation failure in the 1.0.42 log. NVDA announced Ignore Once, but Word exposed that focused button with a different accessibility window handle from the object found in the dialog. Activation now uses the confirmed “Ignore Once” focus name, so the delayed Space command is delivered to the actual button.

The supplied log also confirms slow-proofing speech is disabled and contains no RateCommand in error or suggestion spelling sequences. The longer cases coincide with NVDA watchdog freezes, so no unverified speech-rate alteration was made.

1.0.42
Fixes the remaining no-suggestion “eight” case. The supplied 1.0.41 log showed Space sent at 17:36:58.216, before Word gave Ignore Once focus at 17:36:58.578; Word consequently spoke “space” and waited for manual Alt+I. Alt+C and Alt+X now wait until Ignore Once actually has focus before sending Space.

1.0.41
Makes Alt+X consistently advance a classic proofing issue using Ignore Once. The log showed Alt+X on “there” only reannounced the focused “their” suggestion instead of moving to the next error.

1.0.40
When Word rejects the Ignore Once button’s accessibility action, focuses that button and presses Space instead. This exactly matches the successful manual sequence recorded in the 1.0.39 log.

1.0.39
Uses Word’s actual “Ignore Once” button for Alt+C and Alt+X when a classic grammar issue has no suggestions. Version 1.0.38’s Alt+I mnemonic was recorded but did not activate the button for “eight.”

1.0.38
Makes Alt+C and Alt+X advance classic grammar issues that have no suggestions by invoking Word’s logged “Ignore Once” command (Alt+I). The supplied log showed such items expose no Change command, so Word ignored Alt+C and Alt+X.

1.0.37
Shortens the ordinary proofing-dialog settling wait from 180 ms to 50 ms. The supplied log showed correct non-stalled checks completing in 0.43–0.56 seconds, while the remaining longer pauses coincided with NVDA watchdog freezes rather than this add-on timer.

1.0.36
After a no-suggestions result, returns focus from the empty Suggestions control to the error field. This keeps Outlook's Alt+C and Alt+X proofing commands usable for grammar items such as “eight” that do not provide a replacement.

1.0.35
Restores automatic entry into Suggestions for Outlook's silent interim "to" state. This lets Outlook advance to the complete "suppose to" issue without requiring Tab; an unpopulated temporary list remains silent.

1.0.34
Ignores Outlook's trailing standalone "to" focus event when it immediately follows the real "suppose to" grammar error. This event had cancelled the full error's pending suggestion and led to a false “No grammar suggestions available” message.

1.0.33
Suppresses Outlook's interim standalone "to" state entirely. The 1.0.32 log showed it being announced before Outlook later exposed the actual "suppose to" grammar error and "supposed to" suggestion; a timer could not reliably distinguish the two states.

1.0.32
Removes diagnostic accessibility walks of an empty Suggestions list, which the log showed repeating during no-suggestion checks. Shortens the no-suggestion guard from 1.8 seconds to 1.1 seconds; a real suggestion still cancels the message as soon as Outlook exposes its text.

1.0.31
Extends the hold for Outlook's provisional standalone "to" to five seconds. The 1.0.30 log showed Outlook taking 4.4 seconds before exposing the full "suppose to" grammar error, so the prior hold was too short. The full phrase and its "supposed to" suggestion continue to be announced and spelled.

1.0.30
Suppresses Outlook's provisional standalone "to" announcement when it immediately advances to the full "suppose to" grammar error. The full phrase and its "supposed to" suggestion continue to be announced and spelled.

1.0.29
Suppresses Outlook's standalone "Untitled - Message (HTML)" compose-window title while the spell-check completion dialog is still closing. The title remains available during ordinary Outlook use.

1.0.28
Extends the narrow completion-speech filter to six seconds. The 1.0.27 log showed Outlook freeze for two seconds twice while closing the completion dialog, allowing its message-body prompt to arrive after the original two-second filter expired. Only that exact prompt and trailing proofing chrome are affected.

1.0.27
Suppresses Outlook's premature "You are now in the message body, type a message" prompt after "Spell check is complete" and before its completion dialog is dismissed. The suppression applies only during the short completion window; ordinary message-body announcements are unchanged.

1.0.26
Removes a duplicate Outlook dialog classification read immediately before "No grammar suggestions available" or "No spelling suggestions available." The error has already been classified before it is announced, so repeating the expensive read could cause an audible hesitation. The existing short wait for Outlook's temporary blank suggestion row remains, preventing a real late-arriving suggestion from being announced as unavailable.

1.0.25
Prevents a delayed suggestion callback for the previous error from operating on a new error in the same reused Outlook dialog. The 1.0.24 log showed "Suggestion, supposed to" spoken before "Grammar error, suppose to". Delayed callbacks now verify that the current error word is still the word that scheduled them.

1.0.24
Fixes the second-error failure shown in the 1.0.23 log. Another installed Outlook add-on had replaced NVDA's speech function after this add-on loaded, so the proofing filter never saw Outlook's repeated "Suggestions list box" announcement. The filter is now refreshed before F7, Alt+C, and Escape. Also fixes the logged Escape-key crash (an uninitialized focus variable).

1.0.23
Suppresses the exact Outlook proofing chrome still present in the 1.0.22 log: the "Spelling and Grammar" dialog/row/column labels, automatic "Suggestions list box" labels, and the message-title plus "unavailable" utterance produced immediately after Alt+C finishes a check. The grammar/spelling classification behavior is unchanged.

1.0.22
Waits for Outlook to publish a real grammar or spelling classification before announcing a newly found issue. The 1.0.21 log showed a no-suggestion grammar issue introduced as "misspelled" while its dialog was still blank; its later "No grammar suggestions available" announcement was correct. A transient format flag alone is no longer used to label that error.

1.0.21
Restores "Grammar error" for issues Outlook classifies as grammar. The 1.0.20 log showed confirmed grammar issues being introduced incorrectly as "misspelled".

1.0.20
Removes both the add-on's and Outlook's automatic "Suggestions list box" announcements while it moves to a suggestion. Before saying that no suggestions are available, re-checks Outlook's settled explanation so grammar issues use the grammar wording.

1.0.19
Suppresses the remaining automatic "Suggestions list box" announcement throughout an active checker session, prevents a suggestion from being announced before its error, and announces whether grammar or spelling suggestions are unavailable only after Outlook's blank suggestion row has had time to settle.

1.0.18
Restores NVDA's original spelling speech sequence. The 1.0.17 log showed the compact character sequence being passed without utterance boundaries, but it was not spoken as individual letters by the configured synthesizer.

1.0.17
Restores the suggestion position announcement, for example "1 of 1".

1.0.16
Uses the requested compact classic-checker speech format: "misspelled", the error spelled continuously, then "Suggestion", the replacement spelled continuously. Suppresses the extra "Suggestions list box" and suggestion-position announcements, and suppresses Outlook's empty shell labels after cancelling a check.

1.0.15
Introduces each replacement with "Suggestion" before saying and spelling it. Grammar issues continue to be introduced as "Grammar error" and spelling issues as "misspelled".

1.0.14
Restores the original 1.0.5 spelling sequence for both the error and its suggestion. A later change removed the utterance boundaries returned by NVDA's spelling API; this version removes that change and preserves the original spelling behavior.

1.0.13
Reverts the 1.0.11 type-specific no-suggestions announcement. The subsequent log showed Outlook's blank transient row being mistaken for no suggestions immediately before the real "their" suggestion arrived. Blank rows are silent again; the existing exact "No suggestions." announcement is retained only when Outlook supplies no suggestion list at all.

1.0.12
Stops the legacy Outlook word-choice handler from inspecting non-Outlook focus events. The 1.0.11 log captured it scanning an unrelated Explorer list, blocking on an accessibility call, and triggering watchdog recovery. It now runs only on the confirmed bosa_sdm_Mso96 dialog class.

1.0.11
When Outlook has no usable suggestion after its transient blank suggestion row settles, announces either "No grammar suggestions available" or "No spelling suggestions available" after the error and word have been spoken.

1.0.10
Stops Outlook's transient blank suggestion events being announced at all. The 1.0.9 test log showed that "Suggestion text unavailable" was repeated and could arrive before the error; these events have no accessible text and the actual suggestion is announced when Outlook exposes it. Extends suppression of the empty Outlook dialog/window shell for five seconds after completion, covering the trailing shell events in the same log.

1.0.9
Removes utterance-ending commands placed between individual letters while spelling, so words are spelled continuously.

1.0.8
Stops automatic F7 retries for Outlook completion dialogs. NVDA's log showed each retry reopened Outlook's transient shell and triggered a watchdog recovery sound. Word's retry behavior is unchanged.

1.0.7
Suppresses the remaining one-word "dialog" announcement emitted by Outlook's empty F7 shell during retries. This extends the 1.0.6 suppression of the matching "Microsoft Outlook dialog/window" shell labels; actual named proofing dialogs and results remain spoken.

1.0.6
Suppresses only Outlook's empty repeated "Microsoft Outlook dialog" and "Microsoft Outlook window" announcements during F7 retries. Actual spelling and grammar dialogs and all proofing results remain spoken.

1.0.5
"Slow down misspelled words and suggestions when read aloud" now defaults to off instead of on, since most people only want it on occasionally; the readme's wording was updated to match.

Fixed a misspelled word containing punctuation (for example a doubled apostrophe, like typing an apostrophe twice by mistake) being announced two or three times in a row, flickering between a partial and full version of the word, as Word's own dialog settled on the exact span it was flagging. A brief pause is now taken before speaking so only the word Word settles on gets announced.

Fixed F7 sometimes saying "Spell check is complete" immediately after typing a new sentence, without finding an error that was really there, because Word's own background proofing pass had not yet caught up with what was just typed. When this happens right after typing, the add-on now silently retries F7 every few seconds for up to 20 seconds before accepting that the check is actually complete, instead of requiring you to press F7 again yourself.

1.0.4
Fixed a grammar suggestion (e.g. "are" for a subject/verb agreement issue) not being read out at all, saying only "Suggestions" with nothing after it, on a 2026.1.1 build. The suggestion's own list item exposed no name, value, or description; the add-on was then falling back to the suggestions list's own label ("Suggestions:") and reading that out letter by letter as if it were the suggested word. The add-on no longer uses the list's own label as a stand-in for a suggestion, and now also reads a suggestion directly from its on-screen text when Word exposes nothing else, the same way it already reads the boxed misspelled word.

1.0.3
Fixed a specific, confirmed case of a genuine grammar error (subject/verb agreement, "the dogs is...") still being announced as "misspelled" on a 2026.1.1 build. NVDA's debug log showed Word's own explanation text for that issue was "double-check that you're sticking to singular or plural", which none of the existing grammar-category wording matched, so it fell through to the spelling default. Added that phrasing and its near-variants to the classic-dialog classifier.

1.0.2
Added a broader set of grammar-category keywords (subject-verb agreement, passive voice, fragments, wordiness, and others) to the classic-dialog classifier, and it now also reads the dialog's actual window title directly rather than only its accessible name. Added diagnostic logging around suggestion-text reading and issue classification to pin down the exact cause if the previous fixes are not enough on your build; check NVDA's log after testing.

1.0.1
Fixed grammar issues (for example subject/verb agreement, like "the dogs is running") being announced as "misspelled" instead of "Grammar error" on some Word/Outlook builds whose spelling and grammar dialog exposes no text distinguishing the two. The add-on now also checks the format annotation Word applies to the highlighted text in the message itself, which is more reliable than reading the dialog's own labels.

1.0.0
First release. A focused spinoff of Mute Browse Mode, keeping only its F7 spelling and grammar checking support for Word and Outlook.
When a proofing issue has no suggestions, the add-on now says exactly "No suggestions.\""""
